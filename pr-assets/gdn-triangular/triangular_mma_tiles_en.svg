<line x1="120" y1="180" x2="760" y2="820" stroke="#de6c23" stroke-width="4" />
<text x="775" y="824" class="small" text-anchor="start">Main diagonal</text>
<text x="820" y="155" class="cell" text-anchor="start">Counts per K16 row band</text>
<text x="820" y="250.0" class="cell" text-anchor="start">Keep 8 tiles</text>
<text x="820" y="282.0" class="label" text-anchor="start">Skip 0 tiles</text>
<text x="820" y="410.0" class="cell" text-anchor="start">Keep 6 tiles</text>
<text x="820" y="442.0" class="label" text-anchor="start">Skip 2 tiles</text>
<text x="820" y="570.0" class="cell" text-anchor="start">Keep 4 tiles</text>
<text x="820" y="602.0" class="label" text-anchor="start">Skip 4 tiles</text>
<text x="820" y="730.0" class="cell" text-anchor="start">Keep 2 tiles</text>
<text x="820" y="762.0" class="label" text-anchor="start">Skip 6 tiles</text>
<text x="820" y="875" class="cell" text-anchor="start">Kept: 8 + 6 + 4 + 2 = 20</text>
<text x="820" y="911" class="label" text-anchor="start">Skipped: 0 + 2 + 4 + 6 = 12</text>
<text x="820" y="947" class="label" text-anchor="start">Dense: 4 × 8 = 32</text>
<rect x="120" y="852" width="24" height="24" fill="#e0edff" stroke="#7d93b0" stroke-width="1.5" />
<text x="158" y="872" class="label" text-anchor="start">Above diagonal: keep</text>
<rect x="120" y="886" width="24" height="24" fill="#bdd6ff" stroke="#7d93b0" stroke-width="1.5" />
<text x="158" y="906" class="label" text-anchor="start">Crosses diagonal: keep the entire tile</text>
<rect x="120" y="920" width="24" height="24" fill="#eef1f5" stroke="#7d93b0" stroke-width="1.5" />
<text x="158" y="940" class="label" text-anchor="start">Entirely below diagonal: all zero, skip</text>
<text x="120" y="983" class="label" text-anchor="start">Skip if minimum row index &gt; maximum column index: 16k &gt; 8n + 7.</text>
<text x="120" y="1014" class="small" text-anchor="start">Counts are tile multiply-accumulates per M16 row tile, not whole-kernel SASS instruction counts.</text>
</svg>