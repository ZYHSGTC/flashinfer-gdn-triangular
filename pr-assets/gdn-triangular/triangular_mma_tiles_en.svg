<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040">
<title>64×64 upper-triangular right operand: retain 20 of 32 tiles</title>
<desc>Divide N into eight 8-column tiles and K into four 16-row tiles. Skip the 12 all-zero tiles below the diagonal; retain eight tiles crossing the diagonal and 12 tiles above it.</desc>
<rect width="100%" height="100%" fill="#ffffff" />
<style>text {font-family:DejaVu Sans,Arial,sans-serif;fill:#172b4d} .small {font-size:17px} .label {font-size:20px} .cell {font-size:21px;font-weight:600}</style>
<text x="44" y="48" class="cell" text-anchor="start">64×64 upper-triangular right operand: 32 tiles → 20 tiles</text>
<text x="44" y="82" class="label" text-anchor="start">For one M16 row tile, each cell represents one M16×N8×K16 tile multiply-accumulate.</text>
<text x="440.0" y="120" class="label" text-anchor="middle">N: 64 columns ÷ 8 = 8 tiles</text>
<text x="160.0" y="150" class="small" text-anchor="middle">n=0</text>
<text x="160.0" y="172" class="small" text-anchor="middle">0–7</text>
<text x="240.0" y="150" class="small" text-anchor="middle">n=1</text>
<text x="240.0" y="172" class="small" text-anchor="middle">8–15</text>
<text x="320.0" y="150" class="small" text-anchor="middle">n=2</text>
<text x="320.0" y="172" class="small" text-anchor="middle">16–23</text>
<text x="400.0" y="150" class="small" text-anchor="middle">n=3</text>
<text x="400.0" y="172" class="small" text-anchor="middle">24–31</text>
<text x="480.0" y="150" class="small" text-anchor="middle">n=4</text>
<text x="480.0" y="172" class="small" text-anchor="middle">32–39</text>
<text x="560.0" y="150" class="small" text-anchor="middle">n=5</text>
<text x="560.0" y="172" class="small" text-anchor="middle">40–47</text>
<text x="640.0" y="150" class="small" text-anchor="middle">n=6</text>
<text x="640.0" y="172" class="small" text-anchor="middle">48–55</text>
<text x="720.0" y="150" class="small" text-anchor="middle">n=7</text>
<text x="720.0" y="172" class="small" text-anchor="middle">56–63</text>
<text x="100" y="250.0" class="label" text-anchor="end">k=0</text>
<text x="100" y="278.0" class="small" text-anchor="end">0–15</text>
